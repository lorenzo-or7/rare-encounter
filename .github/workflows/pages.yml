# Preview of Rare Encounter on GitHub Pages: https://lorenzo-or7.github.io/rare-encounter/
#
# Runs on every push to feature/complete-experience or feature/cosmic-experience, or by hand
# (Actions → "Deploy preview to GitHub Pages" → Run workflow, once this file is on the default
# branch). Requires Settings → Pages → Source: "GitHub Actions", and each branch allowed in
# Settings → Environments → github-pages → Deployment branches.
#
# Both branches publish to the SAME address: whichever deploy finishes last is what the site
# shows. There is one Pages site per repository, not one per branch.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [feature/complete-experience, feature/cosmic-experience]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, across both branches (one shared group, not one per branch).
# A run in progress is never cancelled halfway, so a deploy is never cut off mid-upload;
# a newer run waits, and if several pile up only the most recent one runs next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Clash Display is licensed (ITF FFL v2.0): self-hosting on our own site is allowed,
      # publishing it through the repository is not. It is fetched from Fontshare at build
      # time, goes into the site only, and never enters Git.
      - run: npm run fonts:setup

      # The loading video (9.1 MB) is too large for the repository (check:safety keeps files
      # over 5 MB and video out of Git), so it lives as an asset of a pinned GitHub Release.
      # The release tag and the file's name, size and SHA-256 are fixed in
      # scripts/media-manifest.json; nothing here ever follows "latest". If the asset is
      # missing or differs in any way, the job stops: no deploy goes out without the video.
      - name: Download loading video from its pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(node -p "require('./scripts/media-manifest.json').release")
          ASSET=$(node -p "require('./scripts/media-manifest.json').asset")
          mkdir -p public/media
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir public/media --clobber; then
            echo "::error title=Loading video unavailable::Could not download $ASSET from release $TAG of $GITHUB_REPOSITORY. Upload the original file to that release (docs/DEPLOY_PAGES.md, 'Loading video') and run the workflow again. Nothing was deployed."
            exit 1
          fi
          if ! npm run --silent media:verify; then
            echo "::error title=Loading video does not match::$ASSET in release $TAG is not the approved file (name, size or SHA-256 differ from scripts/media-manifest.json). Nothing was deployed."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:vendor

      - run: npm run build:pages

      # The video must be in the published artifact, byte for byte.
      - name: Check the video is in the Pages artifact
        run: node scripts/verify-media.mjs --file dist/media/encounter-loading.mp4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
